{% extends "base.html" %}
{% block title %}Log in | Daily Expense Tracker{% endblock %}
{% block main_class %}auth-page{% endblock %}
{% block content %}
  <section class="panel auth-panel">
    <h1>Log in</h1>
    <form method="post" class="stack">
      {% csrf_token %}
      {{ form.as_div }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button class="button primary" type="submit">Log in</button>
    </form>
    <p class="auth-link">New here? <a href="{% url 'register' %}">Create an account</a></p>
  </section>
{% endblock %}
